# Deploy to VPS（阿里云·首尔）—— 推送到 main 自动构建并部署
# 前置条件（GitHub 仓库 Settings → Secrets 已配置）：
#   DEPLOY_HOST   服务器 IP
#   DEPLOY_KEY    部署专用 SSH 私钥（公钥在服务器的 /root/.ssh/authorized_keys）
# 说明：服务器用 standalone 产物 + PM2 运行；送花计数的提交不触发部署。

name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - "content/flowers.json"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 构建 standalone 产物
        run: |
          npm ci
          npm run build
          rm -rf .next/standalone/.next/cache
          cp -r .next/static .next/standalone/.next/static
          # 预置封面/OG 图中文字体（VPS 访问 Google Fonts 不稳，避免运行时 500）
          mkdir -p .next/standalone/fonts
          for w in 400 700; do
            css=$(curl -sfL -A "Mozilla/4.0" "https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@$w&display=swap")
            url=$(echo "$css" | grep -oP "url\(\Khttps:[^)]+?\.ttf" | head -1)
            curl -sfL "$url" -o ".next/standalone/fonts/NotoSansSC-$w.ttf" || echo "字体 $w 下载失败（运行时将回退在线拉取）"
          done

      - name: 同步到服务器（保留服务器上的 .env 与鲜花计数；--delete 清掉已删除的文章等残留）
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          rsync -avz --delete --exclude=".env" --exclude="content/flowers.json" -e "ssh -i ~/.ssh/deploy_key" .next/standalone/ root@${{ secrets.DEPLOY_HOST }}:/home/crypto/app/

      - name: 重启应用（standalone 不读 .env，必须先 source 再启动）
        run: |
          echo "${{ secrets.DEPLOY_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new root@${{ secrets.DEPLOY_HOST }} \
            "echo  | base64 -d | bash"
